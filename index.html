let state={page:'home',mission:0,room:0,level:0,attempt:null,hint:false,completed:[{},{}],bossStep:0,bossHint:false};const app=document.getElementById('app');const escapeHtml=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const count=m=>Object.keys(state.completed[m]).length;const unlocked=()=>count(0)===5;function speak(t){if(!('speechSynthesis'in window)){alert('Vorlesen ist auf diesem Gerät nicht verfügbar.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[⭐🔷🌙❤️🔴🔵🟢🟡🤖💎➡️⬆️❓]/gu,' '));u.lang='de-DE';u.rate=.83;u.pitch=1; speechSynthesis.speak(u)}

else if(state.page==='win'){h=`<section class="hero"><div class="award">🏆 🚀 ✨</div><h1>Der Zahlenplanet ist gerettet!</h1><p class="lead">Ihr habt beide Escape-Rooms geschafft und den Endboss besiegt. Ihr seid echte Mathe-Asse!</p><div class="card center"><div class="award">💎 ⭐ 💎</div><h2>Mission abgeschlossen!</h2><p>Ihr habt gemeinsam nachgedacht, ausprobiert und Rätsel gelöst.</p><p>Welches Rätsel war am kniffligsten? Wie habt ihr die Lösung gefunden?</p><button class="btn primary" data-action="print">🏅 Urkunde drucken</button> <button class="btn secondary" data-action="home">Weitere Level spielen</button></div></section>`}
app.innerHTML=h;app.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));app.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{state.room=Number(b.dataset.room);state.level=state.completed[state.mission][state.room]??0;state.attempt=null;state.hint=false;state.page='room';render()}));app.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{state.level=Number(b.dataset.level);state.attempt=null;state.hint=false;render()}));app.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.attempt=Number(b.dataset.choice);render()}));}
function act(a){if(a==='home'){state.page='home';render()}else if(a==='mission0'||a==='mission1'){const m=Number(a.slice(-1));if(m===1&&!unlocked())return;state.mission=m;state.page='map';render()}else if(a==='map'){state.page='map';render()}else if(a==='nextMission'){state.mission=1;state.page='map';render()}else if(a==='hint'){state.hint=true;render()}else if(a==='speakIntro'){speak('Die Energie des Zahlenplaneten ist verschwunden. Öffnet gemeinsam fünf Sicherheitstüren in der Roboterstation. Danach wartet der geheime Energiekern. Wählt an jeder Tür ein Level und knobelt zusammen.')}else if(a==='speakStory'){speak(data[state.mission].intro)}else if(a==='speakQ'){const q=data[state.mission].rooms[state.room].q[state.level];speak(q[0]+'. '+q[1].replace(/\n/g,'. '))}else if(a==='complete'){state.completed[state.mission][state.room]=state.level;state.page='map';render()}else if(a==='boss'){if(count(1)!==5)return;state.bossStep=0;state.bossHint=false;state.page='boss';render()}else if(a==='bossHint'){state.bossHint=true;render()}else if(a==='speakBoss'){const b=boss[state.bossStep];speak(b.q+'. '+b.v)}else if(a==='checkBoss'){const input=document.getElementById('bossInput'),v=input.value.trim(),fb=document.getElementById('bossFeedback');fb.style.display='block';if(v===boss[state.bossStep].answer){if(state.bossStep===3){state.page='win';render()}else{state.bossStep++;state.bossHint=false;render()}}else{fb.textContent=v===''?'Bitte gebt eine Ziffer ein.':'🔒 Noch verschlossen! Probiert es gemeinsam noch einmal.'}}else if(a==='print'){const w=window.open('','_blank');if(!w){alert('Bitte Pop-ups für die Urkunde erlauben.');return}w.document.write('<!doctype html><html lang="de"><meta charset="utf-8"><title>Mathe-Urkunde</title><body style="font-family:Arial;text-align:center;padding:80px;border:10px double #2a6680"><h1>🏆 Mathe-Asse-Urkunde 🏆</h1><p style="font-size:25px">Wir haben den Zahlenplaneten gerettet!</p><p style="font-size:60px">🚀 ⭐ 🤖</p><p>Gemeinsam geknobelt und beide Missionen geschafft.</p><p style="margin-top:70px">Unsere Namen: ___________________________</p></body></html>');w.document.close();w.print()}}
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Wirklich neu starten? Alle Schlüssel gehen verloren.')){state={page:'home',mission:0,room:0,level:0,attempt:null,hint:false,completed:[{},{}],bossStep:0,bossHint:false};render()}});render();})();
